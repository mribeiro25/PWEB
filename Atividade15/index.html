<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atividade 15 - Formulário</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="pagina">
    <form name="formularioPrincipal" onsubmit="return validar()" class="cartao-formulario">
      <h1>Formulário Principal</h1>

      <div class="linha"></div>

      <div class="campo">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo">
      </div>

      <div class="campo">
        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" placeholder="exemplo@email.com">
      </div>

      <div class="campo">
        <label for="comentario">Comentário:</label>
        <textarea id="comentario" name="comentario" placeholder="Digite seu comentário"></textarea>
      </div>

      <section class="pesquisa">
        <h2>Pesquisa</h2>
        <p>Primeira vez nesta página?</p>

        <div class="opcoes">
          <label>
            <input type="radio" name="pesquisa" value="sim">
            Sim
          </label>

          <label>
            <input type="radio" name="pesquisa" value="nao">
            Não
          </label>
        </div>
      </section>

      <div class="botoes">
        <button type="submit" class="btn-enviar">Enviar</button>
        <button type="reset" class="btn-limpar">Limpar</button>
      </div>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
